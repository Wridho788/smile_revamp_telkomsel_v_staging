image: node:16

pipelines:
  branches:
    develop:
      - step:
            name: Build and Test
            caches:
              - node
            script:
              - yarn
              - CI= DISABLE_ESLINT_PLUGIN=true npm run build
      - step:
          name: Deploy to staging
          deployment: staging
          script:
            - pipe: atlassian/ssh-run:0.4.1
              variables:
               SSH_USER: 'ec2-user'
               SERVER: '13.229.104.241'
               COMMAND: '/bin/bash pipeline-deploy/run.sh'